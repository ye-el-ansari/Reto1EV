<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechUp.com</title>
    <link rel="stylesheet" href="../CSS/estilos.css" />
  </head>
  <body>
    <input type="checkbox" id="them-toggle" class="them-toggle" />
    <div class="body">
      <header>
        <div class="logo" id="logoBtn">
          <img src="../IMAGES/logo.png" width="100px" alt="Logo" />
        </div>
        <div class="navigation">
          <div class="top">
            <div class="topBot">
              <button id="btnLogin">👤 Login</button>
              <button id="cartBtn">
                🛒 Cesta (<span id="cartCount">0</span>)
              </button>
              <label for="them-toggle" id="themeBtn" class="theme-btn">
                <span class="moon">🌙 </span>
                <span class="sun">☀️ </span>
              </label>
            </div>
          </div>
          <div class="navigation-wraper">
            <input type="checkbox" id="menu-toggle" class="menu-toggle" />
            <!-- Icono de hamburguesa vinculado al checkbox -->
            <label for="menu-toggle" class="hamburger-btn">
              <span></span>
              <span></span>
              <span></span>
            </label>
            <div class="header-button" id="header-button">
              <button class="cta" data-go="inicio">Inicio</button>
              <button class="cta" data-go="ordenadores">💻Ordenadores</button>
              <button class="cta" data-go="componentes">⚙️Componentes</button>
              <button class="cta" data-go="perifericos">⌨️Periféricos</button>
            </div>
          </div>
        </div>
      </header>
      <div class="container">
        <aside class="sidebar">
          <!-- Sección Marca -->
          <fieldset class="filter-grupo">
            <legend class="filter-title">Filter</legend>
            <legend class="filter-title">Marca</legend>

            <label class="filter-option">
              <input type="radio" name="filtro" value="nvidia" />
              <span>NVIDIA</span>
            </label>

            <label class="filter-option">
              <input type="radio" name="filtro" value="amd" />
              <span>AMD</span>
            </label>

            <label class="filter-option">
              <input type="radio" name="filtro" value="intel" />
              <span>Intel</span>
            </label>

            <!-- Sección Precio -->

            <legend class="filter-title">Precio</legend>
            <label class="filter-opcion">
              <input type="radio" name="filtro" value="menor" />
              <span> < 200€</span>
            </label>

            <label class="filter-opcion">
              <input type="radio" name="filtro" value="entre" />
              <span> < 200€-500€</span>
            </label>

            <label class="filter-opcion">
              <input type="radio" name="filtro" value="mayor" />
              <span> > 500€</span>
            </label>
          </fieldset>
        </aside>
        <main class="wrap">
          <!-- SECCIÓN 1: Productos -->
          <section class="cards">
            <div class="card">
              <img src="../IMAGES/logo.webp" />
              <h3>nombre del producto</h3>
              <h2 class="price">600€</h2>
              <p class="discount">4.8</p>
              <button>Anadir a la cesta</button>
            </div>
          
          </section>
        </main>
      </div>
      <script src="../JS/productos.js" type="module"></script>

      <div id="toast"></div>

      <footer>techUP · Mockup de la maquetación · Reto 1 DAW</footer>
    </div>
  </body>
</html>
