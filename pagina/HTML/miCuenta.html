<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta</title>
    <link rel="stylesheet" type="text/css" href="../CSS/miCuenta.css">
</head>
<body>
    <main>
        <!--Formulario para inicia sesión o registrarse-->
        <form>
           <!--Los botones tienen que ser de tipo boton ya que si no el addEventListener del formulario de tipo submit se ejecutaría al clickar en cualquiera de los tres botones ya que por defecto estan en tipo submit-->
            <button  type="button" id="iniciarSesion">Iniciar sesion</button><button type="button" id="registrarse">Registrarse</button>
            <div>
            <label for="usuario" class="usuario">Nombre de usuario</label>
            <input type="correo" id="usuario" name="usuario" class="usuario campos">
            <label for="correo" class="correo">Correo electrónico</label>
            <input type="correo" id="correo" name="correo" class="correo campos">
            <label for="contraseña" class="contraseña">Contraseña</label>
            <input type="password" id="contraseña" name="contraseña" class="contraseña campos">
            <label for="confirmarContraseña" class="confirmarContraseña">Confirmar contraseña</label>
            <input type="password" class="confirmarContraseña campos" name="confirmarContraseña" id="confirmarContraseña">

            <input type="submit" value="Entrar" id="entrar" formaction="carrito.html">
            </div>
            
        </form>
    </main>
    <script src="../JS/miCuenta.js"></script>
</body>
</html>
