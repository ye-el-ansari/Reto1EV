<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta</title>
    <link rel="stylesheet" type="text/css" href="../CSS/miCuenta.css">
</head>

<body>
    <div class="body">
        <header>
            <img src="../IMAGES/logo.png" width="100px" alt="Logo">
            <div class="header-button" id="header-button">
                <button id="btnLogin">🔓 Logout</button>
                <button id="btnInicio" data-go="inicio"> 🏠 Inicio</button>
            </div>
        </header>
        <div class="body">

            <main class="auth-main">
                <!-- Eslogan de la tienda -->
                <aside class="auth-aside">
                    <p class="auth-brand">tech<b>UP</b></p>
                    <h2 class="auth-slogan">Tu Hardware, Un Nivel Más Arriba</h2>
                    <p class="auth-lead">Accede a tu cuenta para comprar y consultar tus pedidos.</p>
                </aside>

                <!-- Formulario para iniciar sesión o registrarse -->
                <form class="auth-card" id="form">
                    <!-- Selector de pestañas -->
                    <div class="tabs-container">
                        <button type="button" id="iniciarSesion" class="tab-btn active">Iniciar sesión</button>
                        <button type="button" id="registrarse" class="tab-btn">Registrarse</button>
                    </div>

                    <div class="container">
                        <!-- Nombre de Usuario -->
                        <div class="field-group usuario">
                            <label for="usuario" class="usuario">Nombre de usuario</label>
                            <input type="correo" id="usuario" name="usuario" class="usuario campos"
                                placeholder="Ej. juan123" required>
                        </div>

                        <!-- Correo -->
                        <div class="field-group correo">
                            <label for="correo" class="correo">Correo electrónico</label>
                            <input type="correo" id="correo" name="correo" class="correo campos"
                                placeholder="ejemplo@correo.com">
                        </div>

                        <!-- Contraseña -->
                        <div class="field-group contrasenia">
                            <label for="contrasenia" class="contrasenia">
                                <span class="label-title">Contraseña</span>
                                <div class="toggle-container">
                                    <span id="passStatus" class="estado-contrasenia">Mostrar</span>
                                    <button type="button" class="btn-switch" id="btnContrasenia"></button>
                                </div>
                            </label>
                            <input type="password" id="contrasenia" name="contrasenia" class="contrasenia campos"
                                placeholder="••••••••" required>
                        </div>

                        <!-- Confirmar Contraseña -->
                        <div class="field-group confirmarContrasenia">
                            <label for="confirmarContrasenia" class="confirmarContrasenia">Confirmar contraseña</label>
                            <input type="password" id="confirmarContrasenia" name="confirmarContrasenia"
                                class="confirmarContrasenia campos" placeholder="••••••••">
                        </div>

                        <!-- Mensaje de error -->
                        <p id="error"></p>

                        <!-- Acciones Principales -->
                        <input type="submit" value="Iniciar" id="entrar">

                        <!-- Acciones Secundarias de Cuenta -->
                        <div class="account-actions">
                            <button type="button" id="modificar" class="btn-secondary">Actualizar Datos</button>
                            <button type="button" id="eliminar" class="btn-danger">Eliminar Cuenta</button>
                        </div>
                    </div>

                </form>
            </main>

            <footer>
        <p class="footer-marca">tech<b>UP</b></p>
        <p>Tu Hardware, Un Nivel Más Arriba</p>
        <p>Envío gratis · 3 años de garantía · Asesoramiento experto</p>
        <p class="footer-copy">© 2026 techUP · Proyecto Reto 1 DAW</p>
    </footer>

            <script src="../JS/miCuenta.js"></script>
</body>

</html>
