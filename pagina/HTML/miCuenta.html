<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta</title>
    <link rel="stylesheet" type="text/css" href="../CSS/miCuenta.css">
</head>
<body>
      <input type="checkbox" id="them-toggle" class="them-toggle" />
    <div class="body">
    
    <main class="auth-main">
        <!-- Formulario para iniciar sesión o registrarse -->
        <form class="auth-card">
            
            <!-- Selector de pestañas -->
            <div class="tabs-container">
                <button type="button" id="iniciarSesion" class="tab-btn active">Iniciar sesión</button>
                <button type="button" id="registrarse" class="tab-btn">Registrarse</button>
            </div>

            <div class="container">
                <!-- Nombre de Usuario -->
                <div class="field-group usuario">
                    <label for="usuario" class="usuario">Nombre de usuario</label>
                    <input type="correo" id="usuario" name="usuario" class="usuario campos" placeholder="Ej. juan123">
                </div>

                <!-- Correo -->
                <div class="field-group correo">
                    <label for="correo" class="correo">Correo electrónico</label>
                    <input type="correo" id="correo" name="correo" class="correo campos" placeholder="ejemplo@correo.com">
                </div>

                <!-- Contraseña -->
                <div class="field-group contrasenia">
                    <label for="contrasenia" class="contrasenia">Contraseña</label>
                    <input type="password" id="contrasenia" name="contrasenia" class="contrasenia campos" placeholder="••••••••">
                </div>

                <!-- Confirmar Contraseña -->
                <div class="field-group confirmarContrasenia">
                    <label for="confirmarContrasenia" class="confirmarContrasenia">Confirmar contraseña</label>
                    <input type="password" id="confirmarContrasenia" name="confirmarContrasenia" class="confirmarContrasenia campos" placeholder="••••••••">
                </div>

                <!-- Mensaje de error -->
                <p id="error">El usuario o correo introducidos están en uso</p>

                <!-- Acciones Principales -->
                <input type="submit" value="Entrar" id="entrar" formaction="carrito.html">

                <!-- Acciones Secundarias de Cuenta -->
                <div class="account-actions">
                    <button type="button" id="modificar" class="btn-secondary">Actualizar Datos</button>
                    <button type="button" id="eliminar" class="btn-danger">Eliminar Cuenta</button>
                </div>
            </div>

        </form>
    </main>

    <script src="../JS/miCuenta.js"></script>
</body>
</html>
